server {
    listen 127.0.0.1:8443 ssl;
    server_name server.enenh.com;

    ssl_certificate /etc/letsencrypt/live/server.enenh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.enenh.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:airclipboard_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    absolute_redirect off;
    include /etc/nginx/snippets/airclipboard-location.conf;
    location / { return 404; }
}
